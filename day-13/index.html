<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display property in css</title>
    <style>
        div{
            background-color: red;
            display: inline;
        }
        span{
            background-color: green;
            display: block;

        }
       
        h1{
            background-color: red;
            display: inline;
        }
        .circle{
            height: 30px;
            width: 30px;
            background-color: red;
            border-radius: 50%;
            display: inline-block;
            
        }
        div{
            background-color: green;
            margin-top: 20px;
            color: white;
            display: inline-block;
            height: 100px;
            width: 100px;
        }
    </style>
</head>
<body>
    <!-- block-full width and can have height width -->
     <!-- span-content width and no additional height width -->
      <!-- inline-block-> block-full width and can have height width and
     span-content width and no additional height width 
    <!- div-block element(it means it takes total width of the whole page) -->
    <!-- <div>hi</div> -->
    <!-- span-inline element(means it takes the actual content width only) -->
    <!-- <span>hello there</span> hello -->
    <!-- previous task problem -->
    <h1>Nature Image</h1>
    <div class="circle"></div>


    <div>
        hello world
    </div>
    
</body>
</html>
