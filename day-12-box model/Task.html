
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortgage Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: white;
        }

        /* Main card */
        .card {
            width: 205px;
            border: 2px solid red;
            padding: 3px;
            background-color: white;
        }

        /* Image */
        .card img {
            display: block;
            width: 100%;
            height: 151px;
            object-fit: cover;
        }

        /* Text section */
        .card-content {
            border: 2px solid red;
            margin-top: 4px;
            padding: 10px 11px 12px;
            min-height: 99px;
        }

        /* Heading */
        .card-content h2 {
            margin: 0 0 8px;
            font-size: 14px;
            color: #333;
        }

        /* Description */
        .card-content p {
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="WhatsApp Image 2026-11-22 at 13.16.21.jpeg" alt="A couple sitting together">

       

    </div>

</body>
</html>
