<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .group {
            border: 2px solid black;
            display: flex;
            justify-content: space-between;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            border-radius: 30px;
            width: 150px;
            box-shadow: 10px 30px 20px 2px gray;
        }

        .cod {
            display: flex;
            flex-direction: column;
            justify-content: right;
            background-color: blanchedalmond;
        }

        .logo {
            list-style-type: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .set {
            list-style-type: none;
        }
        button{
            background-color: orange;
            color: white;
            border-radius: 30px;
            padding: 10px 40px;
            border: none;
            font-weight: bold;
            font-size: 20px;
        }
    
    </style>
</head>

<body>
    <div class="group">
        <div class="cod">
            CodingLab
        </div>

        <div class="logo">
            <li>Dashboard</li>
            <li>Projects</li>
            <li>Notifications</li>
            <li>Analytics</li>
            <li>Like</li>
            <li>Wallets</li>
            <li>Messages</li>
        </div>
        <div class="set">
            <li>Logout</li>
            <li>Settings</li>
        </div>
        <button>Proceed to Checkout</button>
    </div>

</body>

</html>
