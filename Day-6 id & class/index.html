<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>id and class in html</title>

    <style>
        .green{
            background-color: green;
        }

        #a1{
            color: red;
        }

    </style>
</head>
<body>
    <!-- 
    id -> unique identifier
    class -> multiple tages can have same class
    -->

    <div class="green" id="a1">hello</div>
    <br>

    <div class="green">i am a second div</div>
    <br>

    <div class="green" id="a2">hi there i am red!</div>
</body>
</html>
