<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position in css</title>
    <style>
        .container{
            height: 100vh;
            border: 2px solid black;
            padding: 10px;
            margin: 150px;
            position: relative;
        }
        .box{
            height: 100px;
            width: 80%;
            background-color: aqua;
            margin-top: 10px;
        }
        .box1{
            /* position: absolute; */
            width: 100px;
            position: absolute;
            bottom: 0;
            right: 0;
        }
        /* 
        negative top=positive bottom and vice-versa */
        .box2{
            background-color: green;
            position: relative;
            top: -30px;
            left: 50px;
            /* bottom: 10px;
            right: 30px; */
        }
        .box3{
            background-color: pink;
        }
        .box4{
            background-color: maroon;
        }
    </style>
</head>
<body>
    <!-- position
    1. relative
     2.absolute
    3. fixed
     4.sticky -->
    <div class="container">
         <div class="box box1"></div>
    <div class="box box2"></div>
     <div class="box box3"></div>
      <div class="box box4"></div> 
    </div>
  

</body>
</html>
